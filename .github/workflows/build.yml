
name: Build and Deploy Sanal Kimya Laboratuvari

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Kodlari indir
        uses: actions/checkout@v4

      - name: Node.js kur
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Bagimliliklari yukle
        run: npm install

      - name: Projeyi derle
        run: npm run build

      - name: GitHub Pages dosyalarini hazirla
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: GitHub Pages'e yayinla
        id: deployment
        uses: actions/deploy-pages@v4
